# Single nginx edge for the minimal stack: serves the OpenReplay UI (static,
# baked into the frontend image at /var/www/openreplay) AND routes API / ingest
# / asset traffic. Mounted over the image's conf.d/default.conf.
#
# Derived from scripts/docker-compose/nginx.conf, trimmed to the minimal set:
# dropped canvases, images, integrations, spot, ws-assist and the /script/ CDN
# passthrough. Unlike the full-stack edge, `/` is served locally (this nginx
# runs inside the frontend image) instead of proxying to a frontend container.

server {
    listen 8080 default_server;

    # Docker DNS, re-resolve so upstream container IP changes are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 100m;
    client_body_buffer_size 512k;
    proxy_buffer_size 64k;
    proxy_buffers 32 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 2048m;
    proxy_connect_timeout 120s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Session recordings and assets -> object storage (path kept, no rewrite).
    # The api signs presigned URLs with the public edge origin (its
    # AWS_ENDPOINT), which is exactly the Host the browser sends here. Forward
    # that Host verbatim to the object store so the S3 v4 signature
    # (SignedHeaders=host) validates. (/|$) is required: the S3 API also hits
    # /mobs?list-type=2 with no trailing slash.
    location ~ ^/(mobs|sessions-assets|static|sourcemaps|records)(/|$) {
        set $upstream_minio minio;
        proxy_set_header Host $http_host;
        proxy_pass http://$upstream_minio:9000;
    }

    # Tracker ingest -> http worker in the bundle (strip /ingest prefix).
    location /ingest/ {
        set $upstream_http openreplay;
        rewrite ^/ingest/(.*) /$1 break;
        proxy_pass http://$upstream_http:8080;
    }

    # v2 API (Go) -> api worker in the bundle on 8081 (strip /v2/api prefix).
    location /v2/api/ {
        set $upstream_api openreplay;
        rewrite ^/v2/api/(.*) /$1 break;
        proxy_pass http://$upstream_api:8081;
    }

    # Core API (Python chalice) -> chalice container (strip /api prefix).
    location /api/ {
        set $upstream_chalice chalice;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream_chalice:8000;
    }

    # Everything else: serve the static UI, SPA-fallback to index.html.
    root /var/www/openreplay;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
