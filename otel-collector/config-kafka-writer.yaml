# Overlay for the writer half of the Kafka-buffered pipeline: Kafka -> ClickHouse.
# A Kafka message is marked only after its batch is inserted into ClickHouse:
# the exporter batches incoming messages and every message waits for the result
# of its batch. Delivery is at-least-once, a failed insert is retried forever.
#
#   otelcol-openreplay --config config.yaml --config config-kafka-writer.yaml

receivers:
  kafka:
    brokers: ${env:OTLP_KAFKA_BROKERS}
    group_id: ${env:OTLP_KAFKA_GROUP:-otel-logs-writer}
    initial_offset: earliest
    logs:
      topics:
        - ${env:OTLP_KAFKA_TOPIC:-otel-logs}
    tls:
      insecure: ${env:OTLP_KAFKA_TLS_INSECURE:-true}
    message_marking:
      after: true
      on_error: false
      on_permanent_error: true
    partition_processing:
      independent: true
    error_backoff:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

exporters:
  clickhouse:
    retry_on_failure:
      max_elapsed_time: 0s
    sending_queue:
      wait_for_result: true
      block_on_overflow: true
      queue_size: 64
      batch:
        sizer: items
        min_size: 10000
        flush_timeout: 1s

service:
  pipelines:
    logs:
      receivers: [kafka]
      processors: [memory_limiter]
      exporters:
        - ${env:OTLP_LOGS_EXPORTER:-clickhouse}
