<!doctype html>
<html>
  <head>
    <title>OpenReplay</title>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="slack-app-id" content="AA5LEB34M" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />

    <!-- IBM Plex Sans is self-hosted (app/ui/styles/fonts.css). Latin 400 is the
         face almost every screen starts with; the rest load by unicode-range. -->
    <link
      rel="preload"
      href="/assets/fonts/ibm-plex-sans-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Turnstile and the API/asset preconnects are injected by the
         inject-html-hints plugin in vite.config.ts. -->
    <script src="/app/initialize.tsx" type="module"></script>
  </head>
  <body>
    <div id="modal-root"></div>
    <div id="app">
      <p style="color: #eee; text-align: center; height: 100%; padding: 25%">
        Loading...
      </p>
    </div>
  </body>
</html>
