server {
  listen 8080 default_server;
  root /var/www/openreplay;
  index index.html;

  # The build precompresses every asset (see `precompress` in vite.config.ts), so
  # serve those files directly instead of re-compressing on each request. The
  # stored copies are gzip -9 rather than the level 6 an on-the-fly pass can
  # afford, so this is both cheaper and smaller.
  gzip_static on;

  # Fallback for anything without a stored .gz.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    text/css
    text/plain;

  # The build also writes .br next to every .gz. Brotli-11 is ~16% smaller than
  # gzip-9 on this bundle (504KB vs 599KB for the entry graph), but `brotli_static`
  # comes from the third-party ngx_brotli module, which the stock nginx images
  # this Dockerfile builds on do not ship — enabling it on an image without the
  # module makes nginx refuse to start. Uncomment once the runtime image includes
  # it; the .br files are already being produced and are simply ignored until then.
  # brotli_static on;

  # Vite content-hashes everything under /assets, so a URL there can never go stale.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ =404;
    # The dots must be escaped: `.(js|css)` matched any char before the group, so
    # paths like /somexjs were treated as assets instead of SPA routes.
    rewrite ^((?!\.(js|css|json|map|png|svg|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot|wasm|mp4)).)*$ /index.html break;
    proxy_intercept_errors on; # see frontend://nginx.org/en/docs/frontend/ngx_frontend_proxy_module.html#proxy_intercept_errors
    error_page 404 =200 /index.html;
  }
}
