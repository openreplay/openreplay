name: Frontend Dev Deployment
on: workflow_dispatch
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock', 'player/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-

      - uses: ./.github/composite-actions/update-keys
        with:
          domain_name: ${{ secrets.DEV_DOMAIN_NAME }}
          license_key: ${{ secrets.DEV_LICENSE_KEY }}
          jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
          minio_access_key: ${{ secrets.DEV_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.DEV_MINIO_SECRET_KEY }}
          pg_password: ${{ secrets.DEV_PG_PASSWORD }}
          registry_url: ${{ secrets.OSS_REGISTRY_URL }}
        name: Update Keys

      - name: Docker login
        run: |
          echo "${{ secrets.OSS_REGISTRY_TOKEN }}" | docker login ${{ secrets.OSS_REGISTRY_URL }} -u ${{ secrets.OSS_DOCKER_USERNAME }} --password-stdin

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME//\//-}_${GITHUB_SHA}" >> $GITHUB_ENV

      - uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.DEV_KUBECONFIG }} # Use content of kubeconfig in secret.
        id: setcontext

      - name: Building and Pushing frontend image
        id: build-image
        env:
          DOCKER_REPO: ${{ secrets.OSS_REGISTRY_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ENVIRONMENT: staging
        run: |
          set -x
          cd frontend
          cp .env.sample .env
          # @openreplay/player is a `file:../player` dependency, so the sibling
          # player/ dir must be present inside the container at /home/<user>/../player.
          PLAYER_DIR=$(cd ../player && pwd)
          # node:24-slim has no bun: mount the runner's (setup-bun) binary and install cache.
          BUN_BIN=$(readlink -f "$(command -v bun)")
          mkdir -p $HOME/.bun/install/cache
          # player is its own project: install its deps so its source imports (fflate, fzstd, …) resolve when frontend bundles it.
          docker run --rm -v /etc/passwd:/etc/passwd -u `id -u`:`id -g` -v ${BUN_BIN}:/usr/local/bin/bun:ro -v $HOME/.bun/install/cache:/tmp/bun-cache -e BUN_INSTALL_CACHE_DIR=/tmp/bun-cache -v $(pwd):/home/${USER} -v ${PLAYER_DIR}:/home/player -w /home/${USER} --name node_build node:24-slim /bin/bash -c "cd /home/player && bun install --frozen-lockfile && cd /home/${USER} && bun install --frozen-lockfile && bun run build"
          # https://github.com/docker/cli/issues/1134#issuecomment-613516912
          # Build context is the repo root (..) so the Dockerfile can reach player/; -f is relative to cwd (frontend).
          DOCKER_BUILDKIT=1 docker build --target=cicd -f Dockerfile -t $DOCKER_REPO/frontend:${IMAGE_TAG} ..
          docker tag $DOCKER_REPO/frontend:${IMAGE_TAG} $DOCKER_REPO/frontend:${IMAGE_TAG}-ee
          docker push $DOCKER_REPO/frontend:${IMAGE_TAG}
          docker push $DOCKER_REPO/frontend:${IMAGE_TAG}-ee

      - name: Deploy to kubernetes foss
        run: |
          cd scripts/helmcharts/

          set -x
          cat <<EOF>/tmp/image_override.yaml
          frontend:
            image:
              tag: ${IMAGE_TAG}
          EOF

          cat /tmp/image_override.yaml
          # Deploy command
          mkdir -p /tmp/charts
          mv openreplay/charts/{ingress-nginx,frontend,connector} /tmp/charts/
          rm -rf  openreplay/charts/*
          mv /tmp/charts/* openreplay/charts/
          helm template openreplay -n app openreplay -f vars.yaml -f /tmp/image_override.yaml --set ingress-nginx.enabled=false --set skipMigration=true --no-hooks | kubectl apply -n app -f -
        env:
          DOCKER_REPO: ${{ secrets.OSS_REGISTRY_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
