name: UI Unit tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'player/**'
      - '.github/workflows/frontend-tests.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        # Full history for the merge-base with origin/dev; blobs are fetched lazily.
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install player dependencies
        working-directory: player
        # player is pinned by a committed player/yarn.lock and has no
        # package-lock.json; this matches build-mcpb.yaml.
        run: yarn install --frozen-lockfile

      - name: Install dependencies
        working-directory: frontend
        run: yarn --immutable

      # Cobertura records absolute source roots; lcov paths are relative to
      # frontend/ (../player/...) and diff-cover can't map them to the git diff.
      - name: Run tests
        working-directory: frontend
        run: yarn test:ci --coverageReporters=text --coverageReporters=cobertura

      - name: Diff coverage
        run: |
          pipx run --spec diff-cover==10.6.0 diff-cover \
            frontend/coverage/cobertura-coverage.xml \
            --compare-branch=origin/dev \
            --exclude '*.gen.ts' 'version.ts' \
            --format markdown:diff-cov.md
          cat diff-cov.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment diff coverage on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ui-coverage
          path: diff-cov.md
