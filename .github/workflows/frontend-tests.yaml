name: UI Unit tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'player/**'
      - '.github/workflows/frontend-tests.yaml'
      - '.github/composite-actions/coverage-report/**'
  # dev pushes store the coverage baseline that PRs compare against
  push:
    branches: [ "dev" ]
    paths:
      - 'frontend/**'
      - 'player/**'
      - '.github/workflows/frontend-tests.yaml'
      - '.github/composite-actions/coverage-report/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        # Full history for the merge-base with origin/dev; blobs are fetched lazily.
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install player dependencies
        working-directory: player
        # player is pinned by a committed player/yarn.lock and has no
        # package-lock.json; this matches build-mcpb.yaml.
        run: yarn install --frozen-lockfile

      - name: Install dependencies
        working-directory: frontend
        run: yarn --immutable

      # Cobertura for diff-cover (lcov paths are relative to frontend/ and can't be
      # mapped back to the git diff); json-summary for the totals.
      - name: Run tests
        working-directory: frontend
        run: yarn test:ci --coverageReporters=text --coverageReporters=cobertura --coverageReporters=json-summary

      - name: Coverage report
        uses: ./.github/composite-actions/coverage-report
        with:
          name: ui
          title: UI coverage
          cobertura: frontend/coverage/cobertura-coverage.xml
          summaries: ui=frontend/coverage/coverage-summary.json
