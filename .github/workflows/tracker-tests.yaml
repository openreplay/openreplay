# Checking unit tests for tracker and assist
name: Tracker tests
on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
    paths:
      - tracker/**
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - tracker/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test Tracker
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        # Full history for the merge-base with the base branch; blobs are fetched lazily.
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun install cache and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            tracker/node_modules
          key: ${{ runner.os }}-tracker-bun-${{ hashFiles('tracker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-tracker-bun-

      - name: Setup Testing packages
        run: |
          cd tracker
          bun install --frozen-lockfile

      # Cobertura for diff-cover (lcov paths are package-relative and can't be
      # mapped back to the git diff); json-summary for the totals.
      - name: Jest tests
        run: |
          cd tracker/tracker
          bun run test:ci --coverageReporters=text --coverageReporters=cobertura --coverageReporters=json-summary

      - name: Building test
        run: |
          cd tracker/tracker
          bun run build

      - name: Published types and package entry points
        run: |
          cd tracker/tracker
          bun run test:types
          node tests-dts/require.cjs
          bun run test:pack

      - name: (TA) Jest tests
        run: |
          cd tracker/tracker-assist
          bun run test:ci --coverageReporters=text --coverageReporters=cobertura --coverageReporters=json-summary

      - name: (TA) Building test
        run: |
          cd tracker/tracker-assist
          bun run build

      - name: Coverage report
        uses: ./.github/composite-actions/coverage-report
        with:
          name: tracker
          title: Tracker coverage
          cobertura: >-
            tracker/tracker/coverage/cobertura-coverage.xml
            tracker/tracker-assist/coverage/cobertura-coverage.xml
          summaries: >-
            tracker=tracker/tracker/coverage/coverage-summary.json
            tracker-assist=tracker/tracker-assist/coverage/coverage-summary.json
