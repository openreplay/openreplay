# Checking unit tests for tracker and assist
name: Tracker tests
on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
    paths:
      - tracker/**
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - tracker/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test Tracker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Cache bun install cache and modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            tracker/node_modules
          key: ${{ runner.os }}-tracker-bun-${{ hashFiles('tracker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-tracker-bun-

      - name: Setup Testing packages
        run: |
          cd tracker
          bun install --frozen-lockfile

      - name: Jest tests
        run: |
          cd tracker/tracker
          bun run test:ci

      - name: Building test
        run: |
          cd tracker/tracker
          bun run build

      - name: Tracker NodeNext declaration consumer
        run: |
          cd tracker/tracker
          bun run test:types

      - name: (TA) Jest tests
        run: |
          cd tracker/tracker-assist
          bun run test:ci

      - name: (TA) Building test
        run: |
          cd tracker/tracker-assist
          bun run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: tracker
          name: tracker
