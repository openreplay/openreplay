# Checking unit tests for tracker and assist
name: Tracker tests
on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
    paths:
      - tracker/**
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - tracker/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test Tracker
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        # Full history for the merge-base with origin/dev; blobs are fetched lazily.
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun install cache and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            tracker/node_modules
          key: ${{ runner.os }}-tracker-bun-${{ hashFiles('tracker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-tracker-bun-

      - name: Setup Testing packages
        run: |
          cd tracker
          bun install --frozen-lockfile

      # Cobertura records absolute source roots; lcov paths are package-relative
      # and diff-cover can't map them back to the git diff.
      - name: Jest tests
        run: |
          cd tracker/tracker
          bun run test:ci --coverageReporters=text --coverageReporters=cobertura

      - name: Building test
        run: |
          cd tracker/tracker
          bun run build

      - name: Published types and package entry points
        run: |
          cd tracker/tracker
          bun run test:types
          node tests-dts/require.cjs
          bun run test:pack

      - name: (TA) Jest tests
        run: |
          cd tracker/tracker-assist
          bun run test:ci --coverageReporters=text --coverageReporters=cobertura

      - name: (TA) Building test
        run: |
          cd tracker/tracker-assist
          bun run build

      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: |
          pipx run --spec diff-cover==10.6.0 diff-cover \
            tracker/tracker/coverage/cobertura-coverage.xml \
            tracker/tracker-assist/coverage/cobertura-coverage.xml \
            --compare-branch=origin/dev \
            --exclude '*.gen.ts' 'version.ts' \
            --format markdown:diff-cov.md
          cat diff-cov.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment diff coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tracker-coverage
          path: diff-cov.md
