name: UI E2E tests
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - frontend/**
      - player/**
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - frontend/**
      - player/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API: ${{ secrets.E2E_API_ORIGIN }}
  ASSETS: ${{ secrets.E2E_ASSETS_ORIGIN }}
  APIEDP: ${{ secrets.E2E_EDP_ORIGIN }}
  # same secrets the cypress suite used, under the names the playwright specs read
  TEST_FOSS_LOGIN: ${{ secrets.CYPRESS_ACCOUNT }}
  TEST_FOSS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Replayer UI smoke tests
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache frontend bun cache and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock', 'player/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Setup env
        run: |
          cd frontend
          echo "NODE_ENV=development" >> .env
          echo "SOURCEMAP=true" >> .env
          echo "ORIGIN=$API" >> .env
          echo "ASSETS_HOST=$ASSETS" >> .env
          echo "API_EDP=$APIEDP" >> .env
          echo "SENTRY_ENABLED = false" >> .env
          echo "SENTRY_URL = ''" >> .env
          echo "CAPTCHA_ENABLED = false" >> .env
          echo "CAPTCHA_SITE_KEY = 'asdad'" >> .env
          echo "VERSION = '1.15.0'" >> .env
          echo "TRACKER_VERSION = '10.0.0'" >> .env
          echo "COMMIT_HASH = 'dev'" >> .env

      - name: Install player dependencies
        working-directory: player
        run: bun install --frozen-lockfile

      - name: Setup packages
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          cd frontend
          bunx playwright install --with-deps chromium

      # playwright.config.ts starts `bun run dev` on :3333 itself and waits for it
      - name: Run E2E tests
        run: |
          cd frontend
          bun run test:e2e
        timeout-minutes: 15

      - name: Upload Debug
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: 'playwright-report'
          path: |
            frontend/playwright-report
            frontend/test-results
