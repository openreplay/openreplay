name: UI E2E tests
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - frontend/**
      - player/**
      - tracker/**
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - frontend/**
      - player/**
      - tracker/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API: ${{ secrets.E2E_API_ORIGIN }}
  ASSETS: ${{ secrets.E2E_ASSETS_ORIGIN }}
  APIEDP: ${{ secrets.E2E_EDP_ORIGIN }}
  CY_ACC: ${{ secrets.CYPRESS_ACCOUNT }}
  CY_PASS: ${{ secrets.CYPRESS_PASSWORD }}
  FOSS_PROJECT_KEY: ${{ secrets.FOSS_PROJECT_KEY }}
  FOSS_INGEST: ${{ secrets.FOSS_INGEST }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test Tracker plus Replayer
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - name: Cache tracker bun cache and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            tracker/node_modules
          key: ${{ runner.os }}-tracker-bun-${{ hashFiles('tracker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-tracker-bun-

      - name: Setup tracker packages
        run: |
          cd tracker
          bun install --frozen-lockfile

      - name: Build tracker inst
        run: |
          cd tracker/tracker
          bun run build

      - name: Setup Testing UI Env
        run: |
          cd tracker/tracker-testing-playground
          echo "REACT_APP_KEY=$FOSS_PROJECT_KEY" >> .env
          echo "REACT_APP_INGEST=$FOSS_INGEST" >> .env

      - name: Cache testing UI node modules
        uses: actions/cache@v4
        with:
          path: tracker/tracker-testing-playground/node_modules
          key: ${{ runner.os }}-playground-yarn-${{ hashFiles('tracker/tracker-testing-playground/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playground-yarn-

      - name: Setup Testing packages
        run: |
          cd tracker/tracker-testing-playground
          yarn

      - name: Cache frontend yarn cache and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/berry/cache
            frontend/node_modules
          key: ${{ runner.os }}-frontend-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-yarn-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Setup env
        run: |
          cd frontend
          echo "NODE_ENV=development" >> .env
          echo "SOURCEMAP=true" >> .env
          echo "ORIGIN=$API" >> .env
          echo "ASSETS_HOST=$ASSETS" >> .env
          echo "API_EDP=$APIEDP" >> .env
          echo "SENTRY_ENABLED = false" >> .env
          echo "SENTRY_URL = ''" >> .env
          echo "CAPTCHA_ENABLED = false" >> .env
          echo "CAPTCHA_SITE_KEY = 'asdad'" >> .env
          echo "VERSION = '1.15.0'" >> .env
          echo "TRACKER_VERSION = '10.0.0'" >> .env
          echo "COMMIT_HASH = 'dev'" >> .env
          echo "{ \"account\": \"$CY_ACC\", \"password\": \"$CY_PASS\" }" > cypress.env.json

      - name: Install player dependencies
        working-directory: player
        run: npm install --no-audit --no-fund

      - name: Setup packages
        run: |
          cd frontend
          yarn --immutable

      - name: Run testing frontend
        run: |
          cd tracker/tracker-testing-playground
          yarn start &> testing.log &
          npx wait-on http://localhost:3000
        timeout-minutes: 4

      - name: Run Frontend
        run: |
          cd frontend
          yarn dev &> frontend.log &
          npx wait-on http://0.0.0.0:3333
        timeout-minutes: 4

      - name: (Chrome) Run visual tests
        run: |
          cd frontend
          yarn cy:test
        timeout-minutes: 5
#        firefox have different viewport somehow
#      - name: (Firefox) Run visual tests
#        run: yarn cy:test-firefox
#      - name: (Edge) Run visual tests
#        run: yarn cy:test-edge

      - name: Dump server logs
        if: ${{ failure() }}
        run: |
          echo "--- frontend ---"; cat frontend/frontend.log || true
          echo "--- playground ---"; cat tracker/tracker-testing-playground/testing.log || true

      - name: Upload Debug
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: 'Snapshots'
          path: |
            frontend/cypress/videos
            frontend/cypress/snapshots/replayer.cy.ts
            frontend/cypress/screenshots
            frontend/cypress/snapshots/generalStability.cy.ts
