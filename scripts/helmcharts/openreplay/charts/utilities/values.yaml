# Default values for openreplay.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

env: {}

efsCleaner:
  retention: 1
  # This value is the new convention, and has priority.
  # retentionHours: 12
  # Seconds to sleep between each session rm -rf (throttles EBS IOPS)
  # 0.1 = ~10 sessions/sec, each rm -rf generates its own IOPS burst
  throttleInterval: "0.1"
  pvc:
    # This can be either persistentVolumeClaim or hostPath.
    # In case of pvc, you'll have to provide the pvc name.
    # For example
    # name: openreplay-efs
    name: "{{ .Values.global.pvcRWXName }}"
    hostMountPath: "{{ .Values.global.orTmpDir }}"

nameOverride: "utilities"
fullnameOverride: "utilities-openreplay"

# 5 3 * * 1 “At 03:05 on Monday.”
# refer: https://crontab.guru/#5_3_*_*_*/2
cron: "5 3 * * *"

# Pod configurations

podAnnotations:
  linkerd.io/inject: disabled

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"
