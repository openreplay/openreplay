replicaCount: 1

image:
  registry: "{{ .Values.global.openReplayContainerRegistry }}"
  repository: otel-collector
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: "otel-collector"
fullnameOverride: "otel-collector-openreplay"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001

# Only the http gateway talks to the collector; it trusts the project headers
# the gateway sets, so it must never be exposed through an ingress.
service:
  type: ClusterIP
  ports:
    otlp: 4318
    metrics: 8888
    health: 13133

serviceMonitor:
  enabled: true
  additionalLabels:
    release: observability
  scrapeConfigs:
    - port: metrics
      honorLabels: true
      interval: 15s
      path: /metrics
      scheme: http
      scrapeTimeout: 10s

# Defaults to global.clickhouse.username; the password comes from the shared
# clickhouse-password secret.
clickhouse:
  username: ""

# memory_limiter in the collector config is a percentage of the memory limit,
# so a limit must always be set.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

terminationGracePeriodSeconds: 60

env: {}

nodeSelector: {}

tolerations: []

affinity: {}

hostAliases: []

healthCheck:
  livenessProbe:
    httpGet:
      path: /
      port: health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
